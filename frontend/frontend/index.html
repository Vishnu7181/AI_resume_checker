<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Resume Checker</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:#0d1117;color:#e6edf3;min-height:100vh;padding:40px 16px}
  .container{max-width:620px;margin:0 auto}
  h1{text-align:center;font-size:2.4rem;margin-bottom:8px;background:linear-gradient(90deg,#4a9eff,#3ddad7);-webkit-background-clip:text;background-clip:text;color:transparent}
  .subtitle{text-align:center;color:#8b949e;margin-bottom:32px}
  .card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:28px}
  .dropzone{border:2px dashed #30363d;border-radius:12px;padding:48px 20px;text-align:center;cursor:pointer;transition:all .2s}
  .dropzone:hover,.dropzone.dragover{border-color:#4a9eff;background:#1c2129}
  .dropzone .icon{font-size:2.5rem;margin-bottom:12px}
  .dropzone h3{margin-bottom:6px}
  .dropzone p{color:#8b949e;font-size:.9rem}
  .file-name{margin-top:12px;color:#3ddad7;font-size:.9rem;display:none}
  label{display:block;color:#3ddad7;font-weight:600;margin:24px 0 8px}
  textarea{width:100%;min-height:140px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:10px;padding:14px;resize:vertical;font-size:.95rem}
  textarea:focus{outline:none;border-color:#4a9eff}
  .hint{color:#8b949e;font-size:.8rem;margin-top:6px}
  .btn{width:100%;margin-top:24px;padding:15px;border:none;border-radius:10px;font-size:1.05rem;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,#6e40c9,#1f6f8b);transition:opacity .2s}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .error{display:none;margin-top:16px;padding:12px;border-radius:8px;background:#3d1d20;border:1px solid #f85149;color:#f85149;font-size:.9rem}
  #results{display:none;margin-top:28px}
  .scores{display:flex;gap:40px;justify-content:center;margin-bottom:24px}
  .score-box{text-align:center}
  .ring{position:relative;width:110px;height:110px;margin:0 auto}
  .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700}
  .score-box .lbl{color:#8b949e;font-size:.85rem;margin-top:6px}
  .chip-box{margin-bottom:18px}
  .chip-box h4{margin-bottom:10px;font-size:.95rem}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:5px 12px;border-radius:20px;font-size:.82rem}
  .chip.match{background:#12261e;color:#3fb950;border:1px solid #238636}
  .chip.miss{background:#2d1a1f;color:#f85149;border:1px solid #f85149}
  .suggestion{background:#161b22;border:1px solid #30363d;border-left:4px solid #3fb950;border-radius:8px;padding:14px 16px;margin-bottom:12px}
  .suggestion.critical{border-left-color:#f85149}
  .suggestion.warning{border-left-color:#d29922}
  .suggestion .sev{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:#3fb950}
  .suggestion.critical .sev{color:#f85149}
  .suggestion.warning .sev{color:#d29922}
  .suggestion h4{margin:4px 0 6px}
  .suggestion p{color:#8b949e;font-size:.9rem}
</style>
</head>
<body>
<div class="container">
  <h1>AI Resume Checker</h1>
  <p class="subtitle">Upload your resume, paste the job description, get an instant ATS match analysis.</p>
  <div class="card">
    <div class="dropzone" id="dropzone">
      <div class="icon">📄</div>
      <h3>Drag &amp; drop your resume</h3>
      <p>or click to browse — PDF, DOCX, TXT (max 5MB)</p>
      <div class="file-name" id="fileName"></div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx,.txt" hidden>
    <label for="jd">Job Description</label>
    <textarea id="jd" placeholder="Paste the full job description here..."></textarea>
    <p class="hint">Minimum 50 characters required.</p>
    <button class="btn" id="analyzeBtn">🚀 Analyze Resume</button>
    <div class="error" id="error"></div>
  </div>
  <div id="results">
    <div class="scores">
      <div class="score-box">
        <div class="ring">
          <svg width="110" height="110" style="transform:rotate(-90deg)">
            <circle cx="55" cy="55" r="48" stroke="#30363d" stroke-width="10" fill="none"/>
            <circle id="scoreRing" cx="55" cy="55" r="48" stroke="#4a9eff" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6"/>
          </svg>
          <div class="val" id="scoreVal">–</div>
        </div>
        <div class="lbl">Match Score</div>
      </div>
      <div class="score-box">
        <div class="ring">
          <svg width="110" height="110" style="transform:rotate(-90deg)">
            <circle cx="55" cy="55" r="48" stroke="#30363d" stroke-width="10" fill="none"/>
            <circle id="atsRing" cx="55" cy="55" r="48" stroke="#3ddad7" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="301.6"/>
          </svg>
          <div class="val" id="atsVal">–</div>
        </div>
        <div class="lbl">ATS Score</div>
      </div>
    </div>
    <div class="chip-box"><h4>✅ Matched Keywords</h4><div class="chips" id="matched"></div></div>
    <div class="chip-box"><h4>❌ Missing Keywords</h4><div class="chips" id="missing"></div></div>
    <h4 style="margin-bottom:12px">💡 Suggestions</h4>
    <div id="suggestions"></div>
  </div>
</div>
<script>
const API = "http://127.0.0.1:8000";
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const errorBox = document.getElementById("error");
let selectedFile = null;

dropzone.onclick = () => fileInput.click();
dropzone.ondragover = e => { e.preventDefault(); dropzone.classList.add("dragover"); };
dropzone.ondragleave = () => dropzone.classList.remove("dragover");
dropzone.ondrop = e => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
};
fileInput.onchange = () => { if (fileInput.files.length) setFile(fileInput.files[0]); };

function setFile(f) {
  selectedFile = f;
  fileName.style.display = "block";
  fileName.textContent = "✓ " + f.name + " (" + Math.round(f.size / 1024) + " KB)";
}

function setRing(ringId, valId, score, color) {
  const ring = document.getElementById(ringId);
  document.getElementById(valId).textContent = score;
  ring.style.transition = "stroke-dashoffset 1s ease";
  ring.style.stroke = color;
  ring.style.strokeDashoffset = 301.6 - (301.6 * score / 100);
}

function esc(t) {
  const d = document.createElement("div");
  d.textContent = t == null ? "" : String(t);
  return d.innerHTML;
}

function renderResults(d) {
  document.getElementById("results").style.display = "block";
  setRing("scoreRing", "scoreVal", d.score, "#4a9eff");
  setRing("atsRing", "atsVal", d.ats_score, "#3ddad7");

  const matched = document.getElementById("matched");
  matched.innerHTML = (d.matched_keywords || []).map(k => '<span class="chip match">' + esc(k) + "</span>").join("") || '<span class="chip">None found</span>';

  const missing = document.getElementById("missing");
  missing.innerHTML = (d.missing_keywords || []).map(k => '<span class="chip miss">' + esc(k) + "</span>").join("") || '<span class="chip">None — great match!</span>';

  const sugg = document.getElementById("suggestions");
  sugg.innerHTML = (d.suggestions || []).map(s =>
    '<div class="suggestion ' + esc(s.severity || "tip") + '">' +
    '<span class="sev">' + esc(s.severity || "tip") + "</span>" +
    "<h4>" + esc(s.title || "") + "</h4>" +
    "<p>" + esc(s.detail || s.description || "") + "</p></div>"
  ).join("");

  document.getElementById("results").scrollIntoView({ behavior: "smooth" });
}

document.getElementById("analyzeBtn").onclick = async () => {
  const btn = document.getElementById("analyzeBtn");
  const jd = document.getElementById("jd").value.trim();
  errorBox.style.display = "none";

  if (!selectedFile) { errorBox.textContent = "⚠ Please upload your resume file first."; errorBox.style.display = "block"; return; }
  if (!jd || jd.length < 50) { errorBox.textContent = "⚠ Please paste a job description (minimum 50 characters)."; errorBox.style.display = "block"; return; }

  const fd = new FormData();
  fd.append("job_description", jd);
  fd.append("file", selectedFile);

  btn.disabled = true;
  btn.textContent = "⏳ Analyzing...";
  try {
    const res = await fetch(API + "/analyze-file", { method: "POST", body: fd });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || "Server error " + res.status);
    }
    renderResults(await res.json());
  } catch (e) {
    errorBox.textContent = "⚠ " + e.message;
    errorBox.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "🚀 Analyze Resume";
  }
};
</script>
</body>
</html>
